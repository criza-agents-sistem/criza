# Registro data-driven de agentes — CRIZA
#
# Sumar un agente nuevo = agregar una entrada acá + que su módulo exponga `run()` con el
# contrato estándar (ver agents.md § Convención para agregar un nuevo agente). No hace falta
# tocar orquestador/registry.py ni orquestador/motor.py.
#
# `km.prop_key`: bajo qué clave de `props` queda el resultado de este agente en el KM. La
# costura (orquestador/invocador.py) escribe siempre `props[prop_key] = output["análisis"]`
# de forma genérica — el agente no escribe su propio resultado al KM, eso ya no es su
# responsabilidad (ver PROPUESTA_DESTINO.md §11 y docs/progress/2026-08-15.md).
#
# `activo: false` = registrado pero no invocable todavía (deuda documentada, no un placeholder
# silencioso). El Motor lo trata igual que un agente no registrado: lo saltea sin romper el flow.

agentes:
  - nombre: mercado
    modulo: market_agent.market_agent
    descripcion: >
      Evalúa demanda real, sustitución de importación y valor cliente (cruces 1, 3, 4 del
      expediente). Demand-first, no analiza factibilidad técnica.
    km:
      prop_key: mercado
    activo: true

  - nombre: evidencia
    modulo: evidence_generalista.evidence_generalista
    descripcion: >
      Evalúa factibilidad técnica de forma technology-agnostic (cruce 2 del expediente). Puede
      recomendar convocar a un especialista científico.
    km:
      prop_key: evidencia
    activo: true

  - nombre: investigacion_amplia
    modulo: investigacion_amplia.investigacion_amplia
    descripcion: >
      Mapeo exhaustivo de un sector — candidatos, competidores, tecnologías, estado del arte.
      Primer filtro, ancho.
    km:
      prop_key: investigacion_amplia
    activo: true

  - nombre: armador
    modulo: armador.armador
    descripcion: >
      Ensambla el expediente de decisión a partir de lo que los demás agentes ya escribieron
      al KM. No investiga, no elige — solo sintetiza lo que ya existe.
    km:
      prop_key: armador
    activo: true

  - nombre: cientifico_especialista
    modulo: scientific_agent.specialist_proteins
    descripcion: >
      Especialista en proteínas — ESMFold, ProteinMPNN, FoldX, diseño de variantes.
    km:
      prop_key: cientifico_especialista
    activo: false  # C16/C17 sin resolver: sin contrato SEB-115 (no expone run() estándar) ni
                   # escritura al KM propia. Habilitar cuando se cierre esa deuda.

  - nombre: microbiologo
    nombre_display: Especialista Microbiólogo
    modulo: microbiologo_agent.microbiologo_agent
    descripcion: >
      Especialista en microbiología aplicada al tratamiento biológico de efluentes/aguas
      residuales. Primer agente de la biblioteca de especialistas (docs/PROPUESTA_DESTINO.md
      §5) — genérico por diseño, sin ningún caso mencionado en su SYSTEM_PROMPT (ver
      microbiologo_agent/docs/DESIGN_GATE.md).
    km:
      prop_key: microbiologo
    activo: true

  - nombre: ingeniero_ambiental
    nombre_display: Especialista Ingeniero Ambiental
    modulo: ingeniero_ambiental_agent.ingeniero_ambiental_agent
    descripcion: >
      Especialista en factibilidad de ingeniería (balances de masa/energía, dimensionamiento
      preliminar, integración de planta) de un enfoque técnico ya identificado por otro
      especialista. Segundo agente de la biblioteca de especialistas — construido en respuesta
      directa al gap que el Microbiólogo ya recomendó en una corrida real sobre Helios (ver
      ingeniero_ambiental_agent/docs/DESIGN_GATE.md). Solo invocable vía frente_id
      (config/plantillas/casos.yaml) — no soporta oportunidad_id.
    km:
      prop_key: ingeniero_ambiental
    activo: true

  - nombre: agronomo
    nombre_display: Especialista Ingeniero Agrónomo
    modulo: agronomo_agent.agronomo_agent
    descripcion: >
      Especialista en uso agronómico (dosis, compatibilidad de cultivo/suelo, normativa de
      aplicación) de un producto/enfoque ya identificado por otro especialista. Tercer agente de
      la biblioteca de especialistas — construido con señal real explícita de Sebas (Helios
      necesita destino para su efluente, el sector agropecuario es un destino probable), no en
      abstracto (ver agronomo_agent/docs/DESIGN_GATE.md). Solo invocable vía frente_id
      (config/plantillas/casos.yaml) — no soporta oportunidad_id.
    km:
      prop_key: agronomo
    activo: true

  - nombre: biotecnologo
    nombre_display: Especialista Biotecnólogo
    modulo: biotecnologo_agent.biotecnologo_agent
    descripcion: >
      Especialista en biotecnología e ingeniería de bioprocesos — evalúa qué producto de valor
      se puede construir vía bioproceso a partir de un material/subproducto ya identificado, y
      con qué ruta biotecnológica. Cuarto agente de la biblioteca de especialistas — sugerido
      por Andrés (colaborador de Sebas) y confirmado por Sebas (ver
      biotecnologo_agent/docs/DESIGN_GATE.md). Distinto del Microbiólogo (trata el material),
      Ingeniero Ambiental (factibilidad de ingeniería) y Agrónomo (uso agronómico del
      resultado) — este responde qué FABRICAR, no cómo tratar ni cómo usar. Solo invocable vía
      frente_id (config/plantillas/casos.yaml) — no soporta oportunidad_id.
    km:
      prop_key: biotecnologo
    activo: true
