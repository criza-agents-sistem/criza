# Config de instancia para el auditor (knowledge_module/auditor/) — Capa 2, CRIZA.
# Los checks son genéricos; este archivo declara QUÉ auditar en esta instancia.
# Ver knowledge_module/docs/AUDITOR_DESIGN_GATE.md.
#
# Si se agrega un agente, plantilla o fuente propia nueva y no se declara acá, el
# auditor no la audita — mantener esto al día es parte de la Definition of Done de
# cualquier módulo nuevo (ver CLAUDE.md).

tenant: criza

plantillas:
  - area: corpus_cientifico
    tipo: fuente
    excluir_campos: [sets, idioma]  # opcionales por diseño, no son gaps si están vacíos
    umbral_gap_pct: 1.0
    segmentar_por: repositorio  # CONICET/INTA — sin esto, un gap de un solo repositorio
                                 # puede quedar oculto detrás del promedio del otro (ver
                                 # gap de texto_completo en INTA, 2026-07-02)

fuentes_propias:
  - clave: corpus_cientifico
    descripcion: "CONICET (625 fichas) + INTA vía el motor nuevo (área corpus_cientifico)"
    nombres_tool_posibles: [buscar_corpus_cientifico, search_corpus_cientifico]
    default_minimo_esperado: 50
    agentes_que_deberian_cubrirla:
      - criza/market_agent/market_agent.py
      - criza/evidence_generalista/evidence_generalista.py
      - criza/investigacion_amplia/investigacion_amplia.py

  - clave: inta_legacy
    descripcion: "Corpus INTA vía tabla documento legacy — FTS exhaustivo (OR sin límite)"
    nombres_tool_posibles: [search_corpus_inta, get_sector_corpus]
    default_minimo_esperado: 500
    agentes_que_deberian_cubrirla:
      - criza/evidence_generalista/evidence_generalista.py
      - criza/investigacion_amplia/investigacion_amplia.py

agentes:
  - archivo: criza/market_agent/market_agent.py
    tools_var: TOOLS
    submit_tool: submit_analysis

  - archivo: criza/evidence_generalista/evidence_generalista.py
    tools_var: TOOLS
    submit_tool: submit_evidencia

  - archivo: criza/investigacion_amplia/investigacion_amplia.py
    tools_var: TOOLS
    submit_tool: submit_investigacion_amplia

  - archivo: criza/armador/armador.py
    tools_var: TOOLS
    # sin submit_tool: armador no tiene fuentes propias, agrega — valida fuentes_y_cobertura
    # de mercado/evidencia aguas arriba (_validar_cobertura_upstream), no declara la suya.
    # El check de contrato no aplica acá; declararlo produciría un falso positivo.

  - archivo: criza/scientific_agent/specialist_proteins.py
    tools_var: TOOLS
    # Agregado 2026-07-06 (AUDIT-C16/C17): agente más viejo del proyecto, nunca migrado al
    # contrato SEB-115 ni al KM write. Se registra a propósito para que check_km_write_ausente
    # lo siga marcando hasta que se cierre — no se declara debe_escribir_km: false porque no
    # hay ninguna decisión real de que este agente no deba escribir al KM, es una deuda.

# Claves del KM producidas para consumo FUERA del sistema de agentes — el humano las lee,
# no otro agente. Sin esto, el contador de piezas desconectadas marcaría el entregable
# final del sistema como basura. Declararlas es una decisión explícita, no un default.
salidas_terminales:
  - props.expediente          # el expediente de decisión: lo consume Sebas, no un agente
  - props.pipeline_status     # estado de corrida: lo consume el humano / la consola
  - props.token_usage         # medición de consumo (principio 7c)

design_gates_glob: "criza/**/DESIGN_GATE.md"
roadmap_glob: "criza/**/ROADMAP.md"
