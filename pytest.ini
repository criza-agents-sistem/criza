[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default: run only unit tests (fast)
# To run integration tests: pytest -m integration
# To run everything: pytest -m ""
addopts = -v --tb=short -m "not integration"

markers =
    unit: unit tests — no external dependencies, always fast
    integration: integration tests — require API access (Semantic Scholar, UniProt, ESMFold)
